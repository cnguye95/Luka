name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:boundary
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # §13's four CI steps: build, unit tests, boundary check, eval CI mode.
      # CI mode calls no model — it measures ranking only.
      - run: npm run eval
